name: Build and release commit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  metadata:
    name: Commit metadata
    if: contains(github.event.head_commit.message, '[build]') || github.event_name == 'workflow_dispatch' || github.actor == 'nektos/act'
    runs-on: ubuntu-24.04
    outputs:
      asset_suffix: ${{ steps.commit.outputs.asset_suffix }}
      release_title: ${{ steps.commit.outputs.release_title }}
      short_sha: ${{ steps.commit.outputs.short_sha }}
      tag: ${{ steps.commit.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create commit names
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true
          commit_ts="$(git log -1 --pretty=%ct 2>/dev/null || date +%s)"
          commit_time="$(TZ='Europe/Istanbul' date -d "@$commit_ts" +'%Y%m%d-%H%M' 2>/dev/null || TZ='Europe/Istanbul' date +'%Y%m%d-%H%M')"
          short_sha="${GITHUB_SHA:0:12}"
          if [[ -z "$short_sha" ]]; then
            short_sha="$(git rev-parse --short=12 HEAD 2>/dev/null || echo 'localbuild000')"
          fi
          echo "asset_suffix=${commit_time}" >> "$GITHUB_OUTPUT"
          echo "release_title=${commit_time} (${short_sha})" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "tag=commit-${short_sha}" >> "$GITHUB_OUTPUT"

  quality:
    name: Tests and static checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Rust
        run: |
          if ! command -v rustup &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal --component rustfmt
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
            export PATH="$HOME/.cargo/bin:$PATH"
          else
            rustup toolchain install stable --profile minimal --component rustfmt
            rustup default stable
          fi

      - name: Check formatting
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo fmt --all -- --check

      - name: Check UI JavaScript
        run: node --check ui/app.js

      - name: Run Rust tests
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --locked

      - name: Run UI tests
        run: node --test tests/routes.test.js

  release-init:
    name: Prepare commit prerelease
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor != 'nektos/act'
    needs:
      - metadata
      - quality
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create or update empty commit release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_TITLE: ${{ needs.metadata.outputs.release_title }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Automated development release for **${RELEASE_TITLE}**.

          Built from \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`.

          Packages:
          - Linux AppImage
          - Debian/Ubuntu DEB
          - Fedora/RHEL RPM
          - Arch Linux package
          - Windows x64 MSI

          This is an unsigned prerelease generated from a development commit.
          EOF

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --prerelease
          fi

  linux-packages:
    name: AppImage, DEB, RPM and Arch
    needs:
      - metadata
      - release-init
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build in Debian 12
        shell: bash
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            debian:12-slim \
            bash ./scripts/ci-build-linux-packages.sh

      - name: Name Linux assets from commit
        env:
          ASSET_SUFFIX: ${{ needs.metadata.outputs.asset_suffix }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp dist/amele-linux-x64.AppImage \
            "release-assets/amele-x64-${ASSET_SUFFIX}.AppImage"
          cp dist/amele-linux-x64.deb \
            "release-assets/amele-x64-${ASSET_SUFFIX}.deb"
          cp dist/amele-linux-x64.rpm \
            "release-assets/amele-x64-${ASSET_SUFFIX}.rpm"
          cp dist/amele-linux-x64.pkg.tar.zst \
            "release-assets/amele-x64-${ASSET_SUFFIX}.pkg.tar.zst"

      - name: Upload Linux artifacts
        if: github.actor != 'nektos/act'
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: release-assets
          if-no-files-found: error
          retention-days: 7

  windows-msi:
    name: Windows GUI and MSI
    needs:
      - metadata
      - release-init
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run Windows tests
        run: cargo test --locked

      - name: Build Windows GUI
        run: cargo build --release --locked

      - name: Verify GUI subsystem and static runtime
        shell: pwsh
        run: |
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsPath = & $VsWhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $VcVars = Join-Path $VsPath "VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "`"$VcVars`" && dumpbin /HEADERS target\release\amele.exe > headers.txt && dumpbin /DEPENDENTS target\release\amele.exe > dependents.txt"
          if ($LASTEXITCODE -ne 0) { throw "dumpbin verification failed" }
          $Headers = Get-Content headers.txt -Raw
          $Dependencies = Get-Content dependents.txt -Raw
          Write-Host $Headers
          Write-Host $Dependencies
          if ($Headers -notmatch 'subsystem \(Windows GUI\)') {
            throw "amele.exe was not linked as a Windows GUI application"
          }
          if ($Dependencies -match 'VCRUNTIME|MSVCP') {
            throw "amele.exe still depends on the external Visual C++ runtime"
          }

      - name: Install WiX Toolset 3.14
        shell: pwsh
        run: |
          $Archive = Join-Path $env:RUNNER_TEMP "wix314-binaries.zip"
          $WixDir = Join-Path $env:RUNNER_TEMP "wix314"
          Invoke-WebRequest `
            -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" `
            -OutFile $Archive
          Expand-Archive $Archive -DestinationPath $WixDir -Force
          $WixDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build MSI
        shell: pwsh
        run: ./scripts/build-windows-msi.ps1

      - name: Verify MSI has no loose UI sources
        shell: pwsh
        run: |
          $UiStageDir = Join-Path $PWD "dist\windows-stage\share\amele\ui"
          if (Test-Path $UiStageDir) {
            Get-ChildItem $UiStageDir -Recurse | Write-Host
            throw "Windows MSI stage contains loose UI source files: $UiStageDir"
          }

          $HarvestedWxs = Join-Path $PWD "dist\wix\harvested.wxs"
          if (Select-String -Path $HarvestedWxs -Pattern "share\amele\ui" -SimpleMatch -Quiet) {
            throw "Windows MSI harvest unexpectedly references share\amele\ui"
          }

      - name: Name Windows asset from commit
        env:
          ASSET_SUFFIX: ${{ needs.metadata.outputs.asset_suffix }}
        shell: pwsh
        run: |
          New-Item release-assets -ItemType Directory -Force | Out-Null
          Copy-Item dist\amele-windows-x64.msi `
            "release-assets\amele-x64-$env:ASSET_SUFFIX.msi"

      - name: Upload Windows artifacts
        if: github.actor != 'nektos/act'
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: release-assets
          if-no-files-found: error
          retention-days: 7

  release:
    name: Finalize commit prerelease
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor != 'nektos/act'
    needs:
      - metadata
      - release-init
      - linux-packages
      - windows-msi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          merge-multiple: true

      - name: Create checksums and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_SUFFIX: ${{ needs.metadata.outputs.asset_suffix }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          
          mkdir -p release-assets
          find downloaded-artifacts -type f -exec cp -f {} release-assets/ \;
          
          cd release-assets
          rm -f *SHA256SUMS.txt
          
          echo "=== Downloaded Artifacts ==="
          ls -lh
          
          sha256sum * > "amele-x64-${ASSET_SUFFIX}-SHA256SUMS.txt"
          
          echo "=== Checksums ==="
          cat "amele-x64-${ASSET_SUFFIX}-SHA256SUMS.txt"
          
          echo "=== Uploading to Release ${RELEASE_TAG} ==="
          for file in *; do
            if [[ -f "$file" ]]; then
              echo "Uploading $file..."
              gh release upload "$RELEASE_TAG" "$file" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber
            fi
          done
          
          echo "=== Release Complete ==="
